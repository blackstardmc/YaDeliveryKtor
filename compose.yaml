services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-delivery}
      POSTGRES_USER: ${DB_USER:-delivery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [delivery-network]

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-delivery}
      DB_USER: ${DB_USER:-delivery}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_ISSUER: ${JWT_ISSUER:-delivery-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-delivery-client}
      JWT_REALM: ${JWT_REALM:-Delivery API}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET with at least 32 random bytes}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-30}
      REFRESH_TOKEN_EXPIRATION_DAYS: ${REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      CORS_ALLOWED_HOSTS: ${CORS_ALLOWED_HOSTS:-localhost:3000}
      DELIVERY_FEE_CENTS: ${DELIVERY_FEE_CENTS:-0}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "0.0.0.0:${PORT:-8080}:8080"
    networks: [delivery-network]

volumes:
  postgres_data:
#    name: delivery-postgres-data

networks:
  delivery-network:
    driver: bridge
